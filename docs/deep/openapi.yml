openapi: 3.0.0
info:
  description: |
    This is a sample server for sphinx-relay below you'll find api docs and such
  version: 1.0.0
  title: Swagger Sphinx-Relay
  termsOfService: 'http://swagger.io/terms/'
  contact:
    name: Sphinx Support
    email: support@stakwork.com
  x-logo:
    url: 'https://miro.medium.com/max/512/1*sAlVjz09nS6f7iYJ6apMhg.png'
    altText: Sphinx-Chat logo
  license:
    name: MIT License
    url: 'https://raw.githubusercontent.com/stakwork/sphinx-relay/master/LICENSE'
tags:
  - name: Tribes
    description: Everything about your Tribes
  - name: Contacts
    description: Everything about your contacts
  - name: Authentication 
    description: Endpoints to enable and to use relay's authenticated endpoints 
paths:
  /tribe_channel:
    post:
      tags:
        - Tribes 
      summary: Add a new channel for tribe in tribe server
      description: Create new tribe text channel.
      operationId: createChannel
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
                    properties:
                     id:
                        type: integer
                     tribe_uuid:
                        type: string
                     name:
                       type: string
                     created:
                       type: string
                       format: date-time
                     deleted:
                        type: boolean
                type: object
          description: Success
        '405':
          description: Invalid input
      parameters:
        - description: "Authentication token."
          in: header
          name: x-user-token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                tribe_uuid:
                  description: The id of the tribe to add channel to.
                  type: string
                host:
                  description: the domain of the host tribe server.
                  type: string
                name:
                  type: string
              type: object
    delete:
      tags:
        - Tribes 
      summary: Delete tribe text channel
      description: delete tribe text channel in the tribes server.
      operationId: deleteChannel
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                  response:
                    type: boolean
                type: object
          description: Success
        '405':
          description: Invalid input
      parameters:
        - description: "Authentication token."
          in: header
          name: x-user-token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                id:
                  description: The id of the channel to delete.
                  type: number
                host:
                  description: the domain of the host tribe server.
                  type: string
              type: object
  /tribes/{tribe_uuid}:
    get:
      tags:
        - Tribes
      summary: Get a tribe info by uuid
      description: Get a tribe info from tribes server by providing a uuid.
      parameters:
        - description: The tribe ID.
          in: path
          name: tribe_uuid 
          required: true
          schema:
            properties:
              tribe_uuid:
                type: string
      operationId: updateChannel
      responses:
        '200':
           content:
             application/json:
               schema:
                 properties:
                   app_url:
                     type: string 
                   bots:
                     type: array 
                     items:
                       type: object 
                       properties:
                         id:
                           type: integer
                   channels:
                     type: array    
                     items:
                       type: number 
                   created:
                     type: string    
                     format: date-time
                   deleted:  
                     type: boolean
                   description:
                     type: string
                   escrow_amount:
                     type: number
                   escrow_millis:
                     type: number
                   feed_type:
                     type: number
                   feed_url:
                     type: string
                   group_key:  
                     type: string
                   img:
                     type: string
                   last_active:
                     type: number
                   member_count:
                     type: number
                   name:
                     type: string
                   owner_alias:
                     type: string
                   owner_pubkey:
                     type: string
                   owner_route_hint:
                     type: string
                   pin:
                     type: string
                   price_per_message:
                     type: number 
                   private:
                     type: boolean 
                   price_to_join:
                     type: number 
                   tags:
                     type: array 
                     items:
                       type: string
                   unique_name:
                     type: string 
                   unlisted:
                     type: boolean 
                   updated:
                     type: string 
                     format: date-time
                   uuid:
                     type: string 
                 type: object
           description: Success
        '405':
          description: Invalid input
  /request_transport_key:
    get:
      tags:
        - Authentication 
      summary: Get transport token key      
      description: This is used for retriving the key used to encrypt the x-transport-token
      operationId: requestTransportKeys 
      responses:
        '200':
           content:
             application/json:
               schema:
                 properties:
                   request_transport_key:
                     type: string 
           description: Success
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get contacts, chats, and subscriptions
      description: Get the authenticated owner's contacts, chats, and subscriptions.
      operationId: getContacts
      parameters:
        - description: Owner authentication token. Either this, x-transport-token, or x-jwt is required.
          in: header
          name: x-user-token
          required: false
          schema:
            type: string
        - description: Encrypted transport token. Either this, x-user-token, or x-jwt is required.
          in: header
          name: x-transport-token
          required: false
          schema:
            type: string
        - description: JWT authentication token. Either this, x-user-token, or x-transport-token is required.
          in: header
          name: x-jwt
          required: false
          schema:
            type: string
        - description: Set to false to exclude contacts created from groups.
          in: query
          name: from_group
          required: false
          schema:
            type: string
            enum:
              - 'false'
        - description: Set to include to return unmet paid-meet contacts.
          in: query
          name: unmet
          required: false
          schema:
            type: string
            enum:
              - include
      responses:
        '200':
          description: Contacts, chats, and subscriptions for the authenticated owner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  response:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            route_hint:
                              type: string
                            public_key:
                              type: string
                            node_alias:
                              type: string
                            alias:
                              type: string
                            photo_url:
                              type: string
                            private_photo:
                              type: boolean
                            is_owner:
                              type: boolean
                            deleted:
                              type: boolean
                            remote_id:
                              type: integer
                            status:
                              type: integer
                            contact_key:
                              type: string
                            device_id:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                            from_group:
                              type: boolean
                            notification_sound:
                              type: string
                            last_active:
                              type: string
                              format: date-time
                            tip_amount:
                              type: integer
                            tenant:
                              type: integer
                            price_to_meet:
                              type: integer
                            unmet:
                              type: boolean
                            blocked:
                              type: boolean
                            hmac_key:
                              type: string
                            person_uuid:
                              type: string
                            last_timestamp:
                              type: integer
                            is_admin:
                              type: boolean
                            push_kit_token:
                              type: string
                            prune:
                              type: integer
                            invite:
                              type: object
                      chats:
                        type: array
                        items:
                          type: object
                      subscriptions:
                        type: array
                        items:
                          type: object
        '400':
          description: Failure, for example when no owner is found.
        '401':
          description: Missing or invalid credentials.
  /contacts/tokens:
    post:
      tags:
        - Authentication 
      summary: Set auth token for owner.
      description: This is used for setting the auth token 
      operationId: saveAuthToken 
      responses:
        '200':
           description: Success
        '400':
           description: Failure one of these issue (no pubkey,no owner, Wrong Password, no token in body, invalid token)
      parameters:
        - description: "X Transport Authentication token."
          in: header
          name: x-transport-token
          required: false 
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  description: (Legacy) Auth token to save with 
                  type: string
                pubkey:
                  description: Owners pubkey.
                  type: string
              type: object
